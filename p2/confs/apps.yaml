apiVersion: v1
kind: ConfigMap
metadata:
  name: app1-content
data:
  index.html: '<!doctype html><html><body><h1>app1</h1></body></html>'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app2-content
data:
  index.html: '<!doctype html><html><body><h1>app2</h1></body></html>'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app3-content
data:
  index.html: '<!doctype html><html><body><h1>app3</h1></body></html>'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
spec:
  replicas: 1
  selector:
    matchLabels: { app: app1 }
  template:
    metadata:
      labels: { app: app1 }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          volumeMounts:
            - { name: content, mountPath: /usr/share/nginx/html, readOnly: true }
      volumes:
        - name: content
          configMap: { name: app1-content }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
spec:
  replicas: 3
  selector:
    matchLabels: { app: app2 }
  template:
    metadata:
      labels: { app: app2 }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          volumeMounts:
            - { name: content, mountPath: /usr/share/nginx/html, readOnly: true }
      volumes:
        - name: content
          configMap: { name: app2-content }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app3
spec:
  replicas: 1
  selector:
    matchLabels: { app: app3 }
  template:
    metadata:
      labels: { app: app3 }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          volumeMounts:
            - { name: content, mountPath: /usr/share/nginx/html, readOnly: true }
      volumes:
        - name: content
          configMap: { name: app3-content }
---
apiVersion: v1
kind: Service
metadata: { name: app1 }
spec:
  selector: { app: app1 }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: v1
kind: Service
metadata: { name: app2 }
spec:
  selector: { app: app2 }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: v1
kind: Service
metadata: { name: app3 }
spec:
  selector: { app: app3 }
  ports: [{ port: 80, targetPort: 80 }]

